<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Coffee Collective – admin dashboard for a coffee farmers' cooperative." />
    <title>Coffee Collective · Dashboard</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script type="module" src="/src/main.js"></script>
  </head>

  <body class="bg-cream font-sans text-bean-900 antialiased dark:bg-bean-950 dark:text-bean-50">

    <!-- ============ SIDEBAR ============ -->
    <aside
      id="sidebar"
      class="fixed inset-y-0 left-0 z-40 flex w-64 -translate-x-full flex-col bg-bean-900 px-4 py-6 transition-transform duration-300 lg:translate-x-0"
      aria-label="Main navigation"
    >
      <div class="mb-8 flex items-center justify-between px-2">
        <a href="#" class="flex items-center gap-3">
          <img src="/favicon.svg" alt="Coffee Collective logo" class="size-10" />
          <span class="font-display text-xl font-bold text-white">Coffee<span class="text-bean-300">.</span></span>
        </a>
      </div>

      <nav class="flex flex-1 flex-col gap-1">
        <a href="#" class="nav-link nav-link-active" aria-current="page">
          <svg class="size-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path stroke-linejoin="round" d="M3 10.5 12 3l9 7.5V21h-6v-6H9v6H3z"/></svg>
          Overview
        </a>
        <a href="#" class="nav-link">
          <svg class="size-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path stroke-linecap="round" d="M2.5 20c.8-3.6 3.4-5.5 6.5-5.5s5.7 1.9 6.5 5.5M16 4.5a3.5 3.5 0 0 1 0 7M18.5 14.8c1.7.8 2.7 2.5 3 5.2"/></svg>
          Farmers
        </a>
        <a href="#" class="nav-link">
          <svg class="size-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path stroke-linejoin="round" d="M3 7h11v9H3zM14 10h4l3 3v3h-7z"/><circle cx="7" cy="18" r="2"/><circle cx="17" cy="18" r="2"/></svg>
          Deliveries
        </a>
        <a href="#" class="nav-link">
          <svg class="size-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3" y="6" width="18" height="13" rx="2"/><path stroke-linecap="round" d="M3 10h18M7 15h3"/></svg>
          Payouts
        </a>
        <a href="#" class="nav-link">
          <svg class="size-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M12 3s6 6.5 6 11a6 6 0 0 1-12 0c0-4.5 6-11 6-11z"/></svg>
          Washing stations
        </a>
        <a href="#" class="nav-link">
          <svg class="size-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path stroke-linecap="round" d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>
          Reports
        </a>
        <a href="#" class="nav-link mt-auto">
          <svg class="size-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path stroke-linecap="round" d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9 7 7M17 17l2.1 2.1M4.9 19.1 7 17M17 7l2.1-2.1"/></svg>
          Settings
        </a>
      </nav>

      <div class="mt-6 rounded-2xl bg-bean-800 p-4">
        <p class="text-sm font-semibold text-white">Harvest season</p>
        <p class="mt-1 text-xs text-bean-200">Week 6 of 14 · peak picking</p>
        <div class="mt-3 h-2 rounded-full bg-bean-950" role="progressbar" aria-valuenow="43" aria-valuemin="0" aria-valuemax="100" aria-label="Harvest progress">
          <div class="h-2 w-[43%] rounded-full bg-leaf-500"></div>
        </div>
      </div>
    </aside>


    <!-- ============ MAIN AREA ============ -->
    <div class="lg:pl-64">

      <main id="main" class="space-y-6 px-4 py-6 sm:px-6 lg:px-8">



      </main>
    </div>

  </body>
</html>
